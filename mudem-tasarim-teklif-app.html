<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mudem Tasarım — Teklif Hesaplayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --cream:#F3EEE1; --paper:#FBF8F1; --navy:#152341; --navy-2:#1E3357;
    --red:#8E2A32; --red-2:#A83A42; --gold:#B5902F; --ink:#2A2620;
    --ink-soft:#6B6455; --line:#DCD3BC; --ok-bg:#EDE7D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#DCD5C2;font-family:'Manrope',sans-serif;color:var(--ink);padding:32px 16px 120px;min-height:100vh;text-transform:uppercase;}
  input, textarea, button{text-transform:uppercase;}
  input::placeholder, textarea::placeholder{text-transform:uppercase;}
  .app{max-width:960px;margin:0 auto;}

  .toolbar{max-width:960px;margin:0 auto 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .toolbar-title{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--navy);letter-spacing:.02em;}
  .toolbar-actions{display:flex;gap:10px;flex-wrap:wrap;}
  button{font-family:'Manrope',sans-serif;cursor:pointer;border:none;font-weight:700;transition:transform .12s ease, box-shadow .12s ease, background .18s ease, opacity .18s ease;}
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--red);color:#fff;padding:11px 18px;border-radius:8px;font-size:.86rem;letter-spacing:.02em;box-shadow:0 2px 0 #5f1a20;}
  .btn-primary:hover{background:var(--red-2);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:.86rem;box-shadow:0 2px 0 #0a1220;}
  .btn-ghost:hover{background:var(--navy-2);}
  .btn-ghost:disabled{opacity:.6;cursor:default;}

  .sheet{background:var(--paper);border:2px solid var(--navy);border-radius:4px;padding:40px 44px 0;position:relative;box-shadow:0 18px 40px -20px rgba(21,35,65,.45);}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px;}
  .brandmark{display:flex;align-items:center;gap:12px;}
  .brandmark img{width:52px;height:52px;object-fit:contain;flex:0 0 auto;}
  .brand-name{font-family:'Playfair Display',serif;font-weight:800;font-size:1rem;color:var(--navy);line-height:1.15;letter-spacing:.03em;}
  .brand-name span{display:block;font-family:'Manrope',sans-serif;font-weight:600;font-size:.62rem;letter-spacing:.14em;color:var(--ink-soft);margin-top:2px;}

  .badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .badge{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--ink-soft);font-weight:600;background:var(--ok-bg);border:1px solid var(--line);padding:6px 10px;border-radius:6px;}
  .badge input{border:none;background:transparent;font-family:'Manrope',sans-serif;font-weight:700;color:var(--ink);font-size:.72rem;width:110px;}
  .badge input:focus{outline:none;}
  .badge b{color:var(--navy);}

  /* photo + sketch header row */
  .media-row{display:grid;grid-template-columns:1fr 1.5fr;gap:16px;margin-bottom:24px;align-items:start;}
  .media-box{border:1px solid var(--line);border-radius:8px;background:#F6F2E7;height:132px;overflow:hidden;position:relative;}

  #photoStrip{display:flex;width:100%;height:100%;gap:2px;}
  .photo-tile{position:relative;flex:1;height:100%;}
  .photo-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-remove{position:absolute;top:3px;right:3px;background:rgba(21,35,65,.75);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:.6rem;line-height:1;cursor:pointer;padding:0;}
  .photo-add{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-weight:700;cursor:pointer;background:transparent;}
  .photo-add.full{flex:1;font-size:1.6rem;flex-direction:column;gap:4px;}
  .photo-add.full::after{content:'Fotoğraf Ekle';font-size:.66rem;letter-spacing:.03em;}
  .photo-add.compact{flex:0 0 34px;font-size:1.1rem;border-left:1px dashed var(--line);}

  .sketch-col{display:flex;flex-direction:column;gap:6px;}
  .type-select{display:flex;gap:5px;}
  .type-btn{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:5px;padding:5px 4px;font-size:.58rem;letter-spacing:.04em;text-transform:uppercase;font-weight:800;}
  .type-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .sketch-box{border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,#F8F5EC,#F1ECDC);height:132px;position:relative;overflow:hidden;}
  .sketch-box svg{width:100%;height:100%;display:none;}
  .sketch-box svg.active{display:block;}
  .sk-el.b-outline{fill:none;stroke:#3A362D;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;}
  .sk-el.b-window{fill:none;stroke:#6b6557;stroke-width:.7;stroke-linecap:round;}
  .sk-el.sk-echo{opacity:.45;stroke-width:.65;}
  .sketch-caption{position:absolute;bottom:4px;right:8px;font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;opacity:.65;font-family:'Playfair Display',serif;font-style:italic;}

  .doc-title-wrap{text-align:center;margin-bottom:6px;}
  .doc-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1.9rem;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;border:none;background:transparent;text-align:center;width:100%;padding:2px 0;}
  .doc-title:focus{outline:none;border-bottom:1px dashed var(--gold);}
  .doc-subtitle{text-align:center;font-size:.72rem;letter-spacing:.32em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:14px;}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 0 26px;}

  .meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 24px;margin-bottom:32px;}
  .meta-field{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .meta-field label{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;}
  .meta-field input{border:none;background:transparent;font-family:'Manrope',sans-serif;font-size:.92rem;font-weight:600;color:var(--ink);padding:2px 0;}
  .meta-field input:focus{outline:none;}

  .group{margin-bottom:26px;}
  .group-head{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:6px 6px 0 0;padding:10px 16px;}
  .group-head input.group-title{flex:1;background:transparent;border:none;color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:.95rem;letter-spacing:.03em;}
  .group-head input.group-title:focus{outline:none;}
  .group-head .remove-group{background:transparent;color:#E7C9CB;border:1px solid rgba(255,255,255,.25);border-radius:5px;font-size:.68rem;padding:5px 9px;font-weight:700;}
  .group-head .remove-group:hover{background:rgba(255,255,255,.08);}

  .group-desc{border:1px solid var(--line);border-top:none;background:#F6F2E7;padding:8px 16px;}
  .group-desc textarea{width:100%;border:none;background:transparent;font-family:'Manrope',sans-serif;font-size:.76rem;color:var(--ink-soft);line-height:1.5;min-height:32px;resize:vertical;}
  .group-desc textarea:focus{outline:none;}

  .items{border:1px solid var(--line);border-top:none;}
  .item-row{display:grid;grid-template-columns:1.3fr 3fr auto;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row:nth-child(even){background:#F6F2E7;}
  .item-name{border:none;background:transparent;font-weight:700;font-size:.86rem;color:var(--ink);}
  .item-name::placeholder{color:#B7AF98;font-weight:600;}
  .item-name:focus{outline:none;}

  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .tier{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;cursor:pointer;transition:border-color .12s ease, background .12s ease;}
  .tier.selected{border-color:var(--gold);background:#FBF3DC;}
  .tier input[type=radio]{accent-color:var(--red);margin:0;flex:0 0 auto;}
  .tier-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;white-space:nowrap;}
  .tier.selected .tier-label{color:var(--navy);}
  .tier-price{border:none;background:transparent;width:100%;font-weight:700;font-size:.78rem;color:var(--ink);text-align:right;min-width:0;}
  .tier-price:focus{outline:none;}

  .remove-item{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:.64rem;font-weight:700;line-height:1;padding:6px 10px;border-radius:5px;white-space:nowrap;}
  .remove-item:hover{color:var(--red);border-color:var(--red);}

  .group-foot{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-top:none;padding:9px 16px;background:var(--ok-bg);}
  .add-item{background:transparent;border:1px dashed var(--gold);color:var(--navy);border-radius:6px;padding:6px 12px;font-size:.72rem;font-weight:700;}
  .add-item:hover{background:#FBF3DC;}
  .group-subtotal{font-size:.8rem;font-weight:800;color:var(--navy);}
  .group-subtotal b{color:var(--red);font-size:.92rem;margin-left:6px;}

  .add-group-row{margin-bottom:34px;}
  .add-group{width:100%;border:1.5px dashed var(--navy);background:transparent;color:var(--navy);border-radius:6px;padding:12px;font-size:.8rem;font-weight:700;letter-spacing:.03em;}
  .add-group:hover{background:#EFE9D8;}

  .grand-total-bar{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:6px;padding:16px 20px;margin-bottom:26px;}
  .grand-total-bar .label{font-family:'Playfair Display',serif;font-weight:700;letter-spacing:.08em;font-size:.9rem;text-transform:uppercase;}
  .grand-total-bar .value{font-family:'Playfair Display',serif;font-weight:800;font-size:1.5rem;color:#F1D57B;}

  .note-box{display:flex;gap:10px;align-items:flex-start;background:#F6F2E7;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;padding:12px 14px;margin-bottom:26px;font-size:.76rem;color:var(--ink-soft);line-height:1.5;}
  .note-box textarea{width:100%;border:none;background:transparent;resize:vertical;font-family:'Manrope',sans-serif;font-size:.76rem;color:var(--ink-soft);line-height:1.5;min-height:40px;}
  .note-box textarea:focus{outline:none;}

  .doc-footer{background:var(--navy);color:#fff;margin:0 -44px;padding:16px 44px;border-radius:0 0 2px 2px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:.68rem;color:#C9D2E3;}
  .doc-footer b{font-family:'Playfair Display',serif;color:#fff;font-size:.82rem;letter-spacing:.06em;}

  /* export-only clone styling */
  .export-mode .remove-group, .export-mode .remove-item, .export-mode .add-item,
  .export-mode .add-group-row, .export-mode .tier:not(.selected),
  .export-mode .type-select, .export-mode .photo-add,
  .export-mode .photo-remove, .export-mode .sketch-caption{display:none !important;}
  .export-mode .item-row{grid-template-columns:1fr auto;}
  .export-mode .tiers{grid-template-columns:1fr;}
  .export-mode .tier{border:none;background:transparent;padding:0;justify-content:flex-end;}
  .export-mode .tier input[type=radio]{display:none;}
  .export-mode .tier-label{display:none;}
  .export-mode .tier-price{text-align:right;font-size:.86rem;}

  @media (max-width:640px){
    .sheet{padding:26px 18px 0;}
    .doc-footer{margin:0 -18px;padding:14px 18px;}
    .meta-grid{grid-template-columns:1fr;}
    .item-row{grid-template-columns:1fr;gap:8px;}
    .tiers{grid-template-columns:1fr;}
    .toolbar{flex-direction:column;align-items:stretch;}
    .media-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <div class="toolbar-title">Mudem Tasarım — Teklif Hesaplayıcı</div>
  <div class="toolbar-actions">
    <button class="btn-ghost" id="exportImg">Görsel Olarak Kaydet</button>
    <button class="btn-primary" id="exportPdf">PDF Olarak İndir</button>
  </div>
</div>

<script>
let groupCounter = 0;
let itemCounter = 0;
const TIER_RATIO = {eco:0.8, std:1.0, prem:1.2};

function fmtInt(n){ return (Math.round(n)||0).toLocaleString('tr-TR'); }
function parsePriceDigits(v){
  const digits = String(v).replace(/[^\d]/g,'');
  return digits ? parseInt(digits,10) : 0;
}

/* ---------- price field auto-format + ±20% ---------- */
function formatPriceField(el){
  const num = parsePriceDigits(el.value);
  el.value = num ? fmtInt(num) + ' ₺' : '';
  return num;
}
function wirePriceInput(input){
  input.addEventListener('input', ()=>{
    const num = formatPriceField(input);
    const row = input.closest('.item-row');
    const tier = input.dataset.tier;
    if(num > 0){
      const base = num / TIER_RATIO[tier];
      ['eco','std','prem'].forEach(t=>{
        if(t===tier) return;
        const other = row.querySelector(`.tier-price[data-tier="${t}"]`);
        const val = Math.round(base * TIER_RATIO[t]);
        other.value = fmtInt(val) + ' ₺';
      });
    }
    recalc();
  });
}

/* ---------- meta field formatting ---------- */
const dateEl = document.getElementById('metaDate');
dateEl.addEventListener('input', ()=>{
  let d = dateEl.value.replace(/[^\d]/g,'').slice(0,8);
  let out = d;
  if(d.length>4) out = d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);
  else if(d.length>2) out = d.slice(0,2)+'/'+d.slice(2);
  dateEl.value = out;
});

const noEl = document.getElementById('metaNo');
noEl.addEventListener('input', ()=>{
  let d = noEl.value.replace(/[^\d]/g,'');
  let kod = d.slice(0,2);
  let rest = d.slice(2);
  if(kod.length===2){
    let n = parseInt(kod,10);
    if(n>81) kod='81';
    if(n<1) kod='01';
  }
  noEl.value = kod.length===2 ? kod+'/'+rest : kod;
});

const areaEl = document.getElementById('metaArea');
areaEl.addEventListener('input', ()=>{
  let d = areaEl.value.replace(/[^\d]/g,'');
  areaEl.value = d ? d + ' m²' : '';
});

/* ---------- items & groups ---------- */
function createItem(value, placeholder, prices, selectedTier){
  itemCounter++;
  const id = 'item-'+itemCounter;
  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.id = id;
  row.innerHTML = `
    <input class="item-name" value="${value||''}" placeholder="${placeholder}">
    <div class="tiers">
      ${['eco','std','prem'].map(t=>{
        const labels = {eco:'Ekonomik', std:'Standart', prem:'Premium'};
        const val = prices[t] ? fmtInt(prices[t]) + ' ₺' : '';
        return `<label class="tier ${t===selectedTier?'selected':''}">
          <input type="radio" name="tier-${id}" value="${t}" ${t===selectedTier?'checked':''}>
          <span class="tier-label">${labels[t]}</span>
          <input type="text" class="tier-price" data-tier="${t}" value="${val}" placeholder="0" inputmode="numeric">
        </label>`;
      }).join('')}
    </div>
    <button class="remove-item" title="Satırı sil">Satırı Sil</button>
  `;
  row.querySelectorAll('.tier input[type=radio]').forEach(r=>{
    r.addEventListener('change', ()=>{
      row.querySelectorAll('.tier').forEach(t=>t.classList.remove('selected'));
      r.closest('.tier').classList.add('selected');
      recalc();
    });
  });
  row.querySelectorAll('.tier-price').forEach(wirePriceInput);
  row.querySelector('.item-name').addEventListener('input', recalc);
  row.querySelector('.remove-item').addEventListener('click', ()=>{ row.remove(); recalc(); });
  return row;
}

function createGroup(title, desc, rowCount){
  groupCounter++;
  const id = 'group-'+groupCounter;
  const section = document.createElement('section');
  section.className = 'group';
  section.dataset.id = id;
  section.dataset.rowcount = 0;
  section.innerHTML = `
    <div class="group-head">
      <input class="group-title" value="${title}">
      <button class="remove-group">Grubu Sil</button>
    </div>
    <div class="group-desc"><textarea placeholder="İşin tanımı (opsiyonel)...">${desc||''}</textarea></div>
    <div class="items"></div>
    <div class="group-foot">
      <button class="add-item">+ Satır Ekle</button>
      <div class="group-subtotal">Ara Toplam <b>0 ₺</b></div>
    </div>
  `;
  const itemsWrap = section.querySelector('.items');
  const addRow = ()=>{
    const n = parseInt(section.dataset.rowcount,10) + 1;
    section.dataset.rowcount = n;
    itemsWrap.appendChild(createItem('', 'Kalem '+n, {eco:'',std:'',prem:''}, 'std'));
  };
  for(let i=0;i<rowCount;i++) addRow();

  section.querySelector('.add-item').addEventListener('click', ()=>{ addRow(); recalc(); });
  section.querySelector('.remove-group').addEventListener('click', ()=>{ section.remove(); recalc(); });
  section.querySelector('.group-title').addEventListener('input', recalc);
  return section;
}

function recalc(){
  let grand = 0;
  document.querySelectorAll('.group').forEach(group=>{
    let sub = 0;
    group.querySelectorAll('.item-row').forEach(row=>{
      const checked = row.querySelector('.tier input[type=radio]:checked');
      if(checked){
        const priceInput = row.querySelector(`.tier-price[data-tier="${checked.value}"]`);
        sub += parsePriceDigits(priceInput.value);
      }
    });
    group.querySelector('.group-subtotal b').textContent = fmtInt(sub) + ' ₺';
    grand += sub;
  });
  document.getElementById('grandTotal').textContent = fmtInt(grand) + ' ₺';
}

document.getElementById('addGroupBtn').addEventListener('click', ()=>{
  const g = createGroup('Yeni İş Grubu', '', 3);
  document.getElementById('groups').appendChild(g);
  recalc();
});

document.getElementById('groups').appendChild(createGroup('Bina Yapım ve Onarım İşi', '', 3));
recalc();

/* ---------- photo upload (up to 3) ---------- */
const photoInput = document.getElementById('photoInput');
const photoStrip = document.getElementById('photoStrip');
let projectPhotos = [];

function renderPhotos(){
  photoStrip.innerHTML = '';
  projectPhotos.forEach((url, i)=>{
    const tile = document.createElement('div');
    tile.className = 'photo-tile';
    const img = document.createElement('img');
    img.src = url;
    const rm = document.createElement('button');
    rm.className = 'photo-remove';
    rm.textContent = '×';
    rm.title = 'Kaldır';
    rm.addEventListener('click', ()=>{ projectPhotos.splice(i,1); renderPhotos(); });
    tile.appendChild(img);
    tile.appendChild(rm);
    photoStrip.appendChild(tile);
  });
  if(projectPhotos.length < 3){
    const addTile = document.createElement('label');
    addTile.setAttribute('for','photoInput');
    addTile.className = 'photo-add ' + (projectPhotos.length===0 ? 'full' : 'compact');
    addTile.textContent = '+';
    photoStrip.appendChild(addTile);
  }
}
renderPhotos();

photoInput.addEventListener('change', ()=>{
  const files = Array.from(photoInput.files || []).slice(0, 3 - projectPhotos.length);
  if(!files.length) return;
  let pending = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      projectPhotos.push(e.target.result);
      pending--;
      if(pending===0){ renderPhotos(); photoInput.value=''; }
    };
    reader.readAsDataURL(file);
  });
});

/* ---------- procedural cityscape sketches ---------- */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const el = document.createElementNS(NS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function rnd(seed){ const x = Math.sin(seed*999.7)*10000; return x - Math.floor(x); }
function jit(seed, amp){ return (rnd(seed)-0.5)*2*amp; }

function buildVillaScene(g){
  const spots = [
    {x:6,s:.85},{x:40,s:1.05},{x:75,s:.8},{x:110,s:1.1},{x:146,s:.9},
    {x:182,s:1.0},{x:218,s:.82},{x:254,s:1.08},{x:290,s:.95},{x:318,s:.78}
  ];
  spots.forEach((p,i)=>{
    const bw=26*p.s, bh=17*p.s, rh=13*p.s;
    const x=p.x, y=114;
    const j = (n,amp)=>jit(i*7+n, amp||0.9);
    const rot = jit(i*13, 1.6);
    const cx = x+bw/2, cy = y-bh/2;
    const roofPeakX = (x+bw/2+j(1,1.2)).toFixed(1);
    const roofPeakY = (y-bh-rh+j(2,1)).toFixed(1);
    const d = `M${(x+j(3)).toFixed(1)},${y} L${(x+j(4)).toFixed(1)},${(y-bh+j(5)).toFixed(1)} Q${roofPeakX},${roofPeakY} ${(x+bw+j(6)).toFixed(1)},${(y-bh+j(7)).toFixed(1)} L${(x+bw+j(8)).toFixed(1)},${y} Z`;
    const outline = svgEl('path',{class:'sk-el b-outline', d, transform:`rotate(${rot.toFixed(1)} ${cx} ${cy})`});
    g.appendChild(outline);
    const echo = svgEl('path',{class:'sk-el sk-echo b-outline', d, transform:`translate(${j(9,1)},${j(10,1)}) rotate(${(rot+j(11,0.8)).toFixed(1)} ${cx} ${cy})`});
    g.appendChild(echo);
    const w=4.2*p.s;
    [0.26,0.74].forEach((f,wi)=>{
      const wx=(x+bw*f-w/2+j(20+wi,0.6)).toFixed(1), wy=(y-bh*0.52+j(22+wi,0.6)).toFixed(1);
      g.appendChild(svgEl('rect',{class:'sk-el b-window', x:wx, y:wy, width:w.toFixed(1), height:w.toFixed(1), rx:1, transform:`rotate(${(rot*.6).toFixed(1)} ${cx} ${cy})`}));
    });
  });
  g.appendChild(svgEl('path',{class:'sk-el b-outline', d:'M2,114.4 Q170,112.8 338,114.6'}));
}

function buildKonutScene(g){
  const blocks = [
    {x:10,w:52,floors:4},{x:74,w:44,floors:3},{x:130,w:58,floors:5},
    {x:200,w:46,floors:3},{x:258,w:56,floors:4},{x:322,w:14,floors:2}
  ];
  blocks.forEach((b,i)=>{
    const fh=13, h=b.floors*fh, x=b.x, yTop=118-h, yBot=118, bw=b.w;
    const j = (n,amp)=>jit(i*11+n, amp||0.9);
    const rot = jit(i*17, 1.0);
    const cx = x+bw/2, cy=(yTop+yBot)/2;
    const d = `M${(x+j(1)).toFixed(1)},${(yBot+j(2)).toFixed(1)} L${(x+j(3)).toFixed(1)},${(yTop+j(4)).toFixed(1)} L${(x+bw+j(5)).toFixed(1)},${(yTop+j(6)).toFixed(1)} L${(x+bw+j(7)).toFixed(1)},${(yBot+j(8)).toFixed(1)} Z`;
    const outline = svgEl('path',{class:'sk-el b-outline', d, transform:`rotate(${rot.toFixed(1)} ${cx} ${cy})`});
    g.appendChild(outline);
    const echo = svgEl('path',{class:'sk-el sk-echo b-outline', d, transform:`translate(${j(9,0.9)},${j(10,0.9)}) rotate(${(rot+j(12,0.6)).toFixed(1)} ${cx} ${cy})`});
    g.appendChild(echo);
    const cols = Math.max(2, Math.round(bw/16));
    for(let f=0; f<b.floors; f++){
      const wy = (yTop + f*fh + fh*0.32 + j(30+f,0.4)).toFixed(1);
      for(let c=0;c<cols;c++){
        const wx = (x + 6 + c*((bw-12)/(cols-1||1)) + j(40+f*cols+c,0.4)).toFixed(1);
        g.appendChild(svgEl('rect',{class:'sk-el b-window', x:wx, y:wy, width:6, height:6, rx:1, transform:`rotate(${(rot*.7).toFixed(1)} ${cx} ${cy})`}));
      }
    }
  });
  g.appendChild(svgEl('path',{class:'sk-el b-outline', d:'M4,118.3 Q170,116.9 336,118.4'}));
}

function buildRezidansScene(g){
  const towers = [
    {x:6,h:52},{x:30,h:82},{x:54,h:38},{x:80,h:98},{x:104,h:58},
    {x:130,h:104},{x:154,h:46},{x:180,h:88},{x:206,h:62},{x:232,h:94},
    {x:258,h:42},{x:284,h:78},{x:310,h:56},{x:326,h:34}
  ];
  towers.forEach((t,i)=>{
    const w=17, x=t.x, yBot=120, yTop=120-t.h;
    const j = (n,amp)=>jit(i*19+n, amp||0.7);
    const rot = jit(i*23, 0.9);
    const cx = x+w/2, cy=(yTop+yBot)/2;
    const d = `M${(x+j(1)).toFixed(1)},${(yBot+j(2)).toFixed(1)} L${(x+j(3)).toFixed(1)},${(yTop+j(4)).toFixed(1)} L${(x+w+j(5)).toFixed(1)},${(yTop+j(6)).toFixed(1)} L${(x+w+j(7)).toFixed(1)},${(yBot+j(8)).toFixed(1)} Z`;
    const outline = svgEl('path',{class:'sk-el b-outline', d, transform:`rotate(${rot.toFixed(1)} ${cx} ${cy})`});
    g.appendChild(outline);
    const echo = svgEl('path',{class:'sk-el sk-echo b-outline', d, transform:`translate(${j(9,0.7)},${j(10,0.7)}) rotate(${(rot+j(12,0.5)).toFixed(1)} ${cx} ${cy})`});
    g.appendChild(echo);
    const rows = Math.max(1, Math.floor(t.h/15));
    for(let r=1;r<=rows;r++){
      const wy = (yTop + r*13 + j(20+r,0.4)).toFixed(1);
      g.appendChild(svgEl('path',{class:'sk-el b-window', d:`M${(x+3).toFixed(1)},${wy} L${(x+w-3).toFixed(1)},${wy}`, transform:`rotate(${(rot*.7).toFixed(1)} ${cx} ${cy})`}));
    }
  });
  g.appendChild(svgEl('path',{class:'sk-el b-outline', d:'M2,120.4 Q170,118.6 338,120.3'}));
}

buildVillaScene(document.getElementById('scene-villa'));
buildKonutScene(document.getElementById('scene-konut'));
buildRezidansScene(document.getElementById('scene-rez'));

let sceneTimer = null;
const sketchNames = {konut:'Konut', villa:'Villa', rezidans:'Rezidans'};

function playScene(svg){
  const els = Array.from(svg.querySelectorAll('.sk-el'));
  if(!els.length) return;
  const totalDraw = 7600;
  const step = totalDraw / els.length;
  const dur = Math.max(140, step*2.4);
  els.forEach(el=>{
    const len = el.getTotalLength();
    el.style.transition = 'none';
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  });
  void svg.getBoundingClientRect();
  els.forEach((el,i)=>{
    setTimeout(()=>{
      el.style.transition = `stroke-dashoffset ${dur}ms ease`;
      el.style.strokeDashoffset = 0;
    }, i*step);
  });
}

function activateBuilding(type){
  document.querySelectorAll('.sketch-box svg').forEach(svg=>{
    svg.classList.toggle('active', svg.dataset.type===type);
  });
  document.getElementById('sketchCaption').textContent = sketchNames[type];
  document.querySelectorAll('.type-btn').forEach(b=> b.classList.toggle('active', b.dataset.type===type));
  if(sceneTimer) clearInterval(sceneTimer);
  const activeSvg = document.querySelector(`.sketch-box svg[data-type="${type}"]`);
  playScene(activeSvg);
  sceneTimer = setInterval(()=> playScene(activeSvg), 10000);
}

document.querySelectorAll('.type-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> activateBuilding(btn.dataset.type));
});
window.addEventListener('load', ()=> activateBuilding('villa'));

/* ---------- export ---------- */
/* Capture the real, visible #sheet directly instead of an off-screen clone —
   avoids all visibility/positioning quirks that made html2canvas produce
   blank output. We briefly switch the live sheet into "export mode"
   (hide edit controls, freeze the sketch), capture it, then restore it. */
function enterExportMode(){
  const sheet = document.getElementById('sheet');
  sheet.classList.add('export-mode');
  const activeSvg = sheet.querySelector('.sketch-box svg.active');
  let gEl = null, filterAttr = null;
  if(activeSvg){
    gEl = activeSvg.querySelector('g[filter]');
    if(gEl){ filterAttr = gEl.getAttribute('filter'); gEl.removeAttribute('filter'); }
    if(sceneTimer){ clearInterval(sceneTimer); sceneTimer = null; }
    activeSvg.querySelectorAll('.sk-el').forEach(el=>{
      el.style.transition = 'none';
      el.style.strokeDasharray = 'none';
      el.style.strokeDashoffset = '0';
    });
  }
  return { sheet, activeSvg, gEl, filterAttr };
}
function exitExportMode(ctx){
  ctx.sheet.classList.remove('export-mode');
  if(ctx.activeSvg){
    if(ctx.gEl && ctx.filterAttr) ctx.gEl.setAttribute('filter', ctx.filterAttr);
    activateBuilding(ctx.activeSvg.dataset.type);
  }
}

/* ---------- mobile / Safari aware helpers ---------- */
const isIOS = /iP(hone|od|ad)/.test(navigator.platform) ||
              (/Mac/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const supportsDownload = 'download' in document.createElement('a') && !isIOS;

// En güvenilir mobil yol: native paylaşım menüsü (Web Share API, Level 2).
// iOS 15+ ve güncel Android Chrome'da dosyayı doğrudan "Fotoğraflara Kaydet"
// veya "Dosyalara Kaydet" ile kaydettirir; <a download> kısıtlamalarından
// hiç etkilenmez. Desteklenmezse indirme linkine, o da olmazsa yeni
// sekmede açıp uzun-basarak-kaydetme talimatına düşer.
async function deliverBlob(blob, filename, mime){
  try{
    const file = new File([blob], filename, { type: mime });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch(err){
    // Kullanıcı paylaşım menüsünü iptal ettiyse (AbortError) sessizce çık,
    // başka bir hataysa aşağıdaki yollara düş.
    if(err && err.name === 'AbortError') return;
  }

  if(supportsDownload){
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  } else {
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){
      // Pop-up engellendiyse aynı sekmede aç
      window.location.href = url;
    }
    alert(mime === 'application/pdf'
      ? 'PDF yeni sekmede açıldı. Paylaş simgesinden "Dosyalara Kaydet" ile kaydedebilirsin.'
      : 'Görsel yeni sekmede açıldı. Üzerine uzun basıp "Fotoğraflara Kaydet" seçebilirsin.');
  }
}

function canvasToBlob(canvas, type, quality){
  return new Promise((resolve, reject)=>{
    canvas.toBlob(b=> b ? resolve(b) : reject(new Error('Canvas blob oluşturulamadı.')), type, quality);
  });
}

async function toCanvas(){
  if(typeof html2canvas === 'undefined'){
    throw new Error('html2canvas kütüphanesi yüklenemedi (internet bağlantısını kontrol edin ya da reklam engelleyiciyi kapat).');
  }
  const ctx = enterExportMode();
  await new Promise(r=>setTimeout(r, 80));
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; } catch(e){}
  }
  try{
    // Mobil tarayıcılarda canvas boyutu belli bir piksel sayısını aşarsa
    // (özellikle çok sayıda iş grubu eklenince sayfa uzar) çizim sessizce
    // boş/bozuk çıkabiliyor. Yüksekliğe göre ölçeği güvenli aralıkta tutuyoruz.
    const rect = ctx.sheet.getBoundingClientRect();
    const MAX_DIM = 4000;
    let scale = 2;
    if(rect.height * scale > MAX_DIM) scale = Math.max(1, MAX_DIM / rect.height);
    if(rect.width * scale > MAX_DIM) scale = Math.min(scale, MAX_DIM / rect.width);

    const canvas = await html2canvas(ctx.sheet, {scale, backgroundColor:'#FBF8F1', useCORS:true, logging:false});
    return canvas;
  } finally {
    exitExportMode(ctx);
  }
}

document.getElementById('exportImg').addEventListener('click', async ()=>{
  const btn = document.getElementById('exportImg');
  const orig = btn.textContent; btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
  try{
    const canvas = await toCanvas();
    const blob = await canvasToBlob(canvas, 'image/jpeg', 0.92);
    await deliverBlob(blob, 'mudem-tasarim-teklif.jpg', 'image/jpeg');
  } catch(err){
    console.error('Görsel export hatası:', err);
    alert('Görsel oluşturulurken bir sorun oluştu: ' + (err && err.message ? err.message : err));
  } finally { btn.disabled = false; btn.textContent = orig; }
});

document.getElementById('exportPdf').addEventListener('click', async ()=>{
  const btn = document.getElementById('exportPdf');
  const orig = btn.textContent; btn.disabled = true; btn.textContent = 'Hazırlanıyor…';
  try{
    if(typeof window.jspdf === 'undefined'){ throw new Error('jsPDF kütüphanesi yüklenemedi (internet bağlantısını kontrol edin ya da reklam engelleyiciyi kapat).'); }
    const canvas = await toCanvas();
    const { jsPDF } = window.jspdf;
    const imgW = canvas.width, imgH = canvas.height;
    const pdf = new jsPDF({ orientation: imgH > imgW ? 'portrait' : 'landscape', unit:'pt', format:[imgW/2, imgH/2] });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, imgW/2, imgH/2);
    const blob = pdf.output('blob');
    await deliverBlob(blob, 'mudem-tasarim-teklif.pdf', 'application/pdf');
  } catch(err){
    console.error('PDF export hatası:', err);
    alert('PDF oluşturulurken bir sorun oluştu: ' + (err && err.message ? err.message : err));
  } finally { btn.disabled = false; btn.textContent = orig; }
});
